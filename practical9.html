<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal To-Do List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">
            Personal To-Do List
        </h1>

        <p class="text-center text-gray-500 mb-6">
            Organize your academic and personal tasks
        </p>

        <!-- Add Task Section -->
        <div class="flex gap-2 mb-6">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2
                       focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                onclick="addTask()"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg
                       hover:bg-blue-700 transition"
            >
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3"></ul>

        <!-- Message when no tasks exist -->
        <p id="emptyMessage" class="text-center text-gray-400 mt-5">
            No tasks added yet.
        </p>

    </div>

    <script>
        // Add a new task
        function addTask() {

            const taskInput = document.getElementById("taskInput");
            const taskText = taskInput.value.trim();

            // Check for empty input
            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }

            // Create list item
            const li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-50 " +
                "border border-gray-200 p-3 rounded-lg";

            // Create task text
            const span = document.createElement("span");
            span.textContent = taskText;
            span.className = "text-gray-700 flex-1 cursor-pointer";

            // Mark task as completed
            span.onclick = function () {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");
            };

            // Create delete button
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className =
                "bg-red-500 text-white px-3 py-1 rounded-md " +
                "hover:bg-red-600 transition ml-3";

            // Delete task
            deleteButton.onclick = function () {
                li.remove();
                updateEmptyMessage();
            };

            // Add elements to list item
            li.appendChild(span);
            li.appendChild(deleteButton);

            // Add task to list
            document.getElementById("taskList").appendChild(li);

            // Clear input
            taskInput.value = "";

            updateEmptyMessage();
        }

        // Show/hide empty message
        function updateEmptyMessage() {

            const taskList = document.getElementById("taskList");
            const emptyMessage = document.getElementById("emptyMessage");

            if (taskList.children.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }
        }

        // Allow Enter key to add task
        document.getElementById("taskInput").addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    addTask();
                }
            }
        );
    </script>

</body>
</html>
