<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Grade Calculator</h2>

    <label>Subject 1 Marks:</label>
    <input type="number" id="mark1" min="0" max="100">

    <label>Subject 2 Marks:</label>
    <input type="number" id="mark2" min="0" max="100">

    <label>Subject 3 Marks:</label>
    <input type="number" id="mark3" min="0" max="100">

    <label>Subject 4 Marks:</label>
    <input type="number" id="mark4" min="0" max="100">

    <label>Subject 5 Marks:</label>
    <input type="number" id="mark5" min="0" max="100">

    <button onclick="calculateGrade()">Calculate Result</button>

    <div id="result"></div>
</div>

<script>
    function calculateGrade() {

        let m1 = Number(document.getElementById("mark1").value);
        let m2 = Number(document.getElementById("mark2").value);
        let m3 = Number(document.getElementById("mark3").value);
        let m4 = Number(document.getElementById("mark4").value);
        let m5 = Number(document.getElementById("mark5").value);

        // Check marks
        if (
            m1 < 0 || m1 > 100 ||
            m2 < 0 || m2 > 100 ||
            m3 < 0 || m3 > 100 ||
            m4 < 0 || m4 > 100 ||
            m5 < 0 || m5 > 100
        ) {
            document.getElementById("result").innerHTML =
                "<b>Please enter marks between 0 and 100.</b>";
            return;
        }

        // Calculate total and percentage
        let total = m1 + m2 + m3 + m4 + m5;
        let percentage = total / 5;

        // Calculate grade
        let grade;

        if (percentage >= 90) {
            grade = "A+";
        } else if (percentage >= 80) {
            grade = "A";
        } else if (percentage >= 70) {
            grade = "B";
        } else if (percentage >= 60) {
            grade = "C";
        } else if (percentage >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        // Display result
        document.getElementById("result").innerHTML =
            "<h3>Result</h3>" +
            "<p><b>Total Marks:</b> " + total + " / 500</p>" +
            "<p><b>Percentage:</b> " + percentage.toFixed(2) + "%</p>" +
            "<p><b>Grade:</b> " + grade + "</p>";
    }
</script>

</body>
</html>
