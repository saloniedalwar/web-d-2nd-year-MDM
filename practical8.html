<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #successMessage {
            color: green;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <form id="registrationForm">

        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="text" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="Minimum 8 characters">
            <span class="error" id="passwordError"></span>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number *</label>
            <input type="text" id="mobile" placeholder="Enter 10-digit mobile number">
            <span class="error" id="mobileError"></span>
        </div>

        <div class="form-group">
            <label for="course">Course *</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.Com">B.Com</option>
            </select>
            <span class="error" id="courseError"></span>
        </div>

        <button type="submit">Register</button>

        <p id="successMessage"></p>
    </form>
</div>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {

        event.preventDefault();

        // Get values
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let mobile = document.getElementById("mobile").value.trim();
        let course = document.getElementById("course").value;

        // Error elements
        let nameError = document.getElementById("nameError");
        let emailError = document.getElementById("emailError");
        let passwordError = document.getElementById("passwordError");
        let mobileError = document.getElementById("mobileError");
        let courseError = document.getElementById("courseError");
        let successMessage = document.getElementById("successMessage");

        // Clear previous errors
        nameError.textContent = "";
        emailError.textContent = "";
        passwordError.textContent = "";
        mobileError.textContent = "";
        courseError.textContent = "";
        successMessage.textContent = "";

        let valid = true;

        // Mandatory name validation
        if (name === "") {
            nameError.textContent = "Full name is required.";
            valid = false;
        }

        // Email validation
        let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
            emailError.textContent = "Email is required.";
            valid = false;
        } else if (!emailPattern.test(email)) {
            emailError.textContent = "Enter a valid email address.";
            valid = false;
        }

        // Password validation
        if (password === "") {
            passwordError.textContent = "Password is required.";
            valid = false;
        } else if (password.length < 8) {
            passwordError.textContent =
                "Password must contain at least 8 characters.";
            valid = false;
        }

        // Mobile number validation
        let mobilePattern = /^[0-9]{10}$/;

        if (mobile === "") {
            mobileError.textContent = "Mobile number is required.";
            valid = false;
        } else if (!mobilePattern.test(mobile)) {
            mobileError.textContent =
                "Mobile number must contain exactly 10 digits.";
            valid = false;
        }

        // Course validation
        if (course === "") {
            courseError.textContent = "Please select a course.";
            valid = false;
        }

        // Final validation
        if (valid) {
            successMessage.textContent =
                "Registration submitted successfully!";

            document.getElementById("registrationForm").reset();
        }
    });
</script>

</body>
</html>
