<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f9;
    }
    .main-header {
      background: linear-gradient(110deg, #5145e5, #5145e5);
    }
    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    input, select, button {
      min-width: 0;
    }
  </style>
</head>

<body class="min-h-screen text-gray-800">

  <!-- Header -->
  <header class="main-header text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-5 py-6">
      <h1 class="text-2xl sm:text-3xl font-bold">
        Smart Expense Tracker
      </h1>
      <p class="text-sm mt-2 text-indigo-100">
        Track your daily expenses easily
      </p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-7">

    <!-- Summary Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7">

      <div class="panel p-5">
        <p class="text-gray-500 text-sm">Total Expenses</p>
        <h2 id="total" class="text-2xl font-bold text-indigo-700 mt-2">
          ₹0.00
        </h2>
      </div>

      <div class="panel p-5">
        <p class="text-gray-500 text-sm">Number of Expenses</p>
        <h2 id="count" class="text-2xl font-bold text-green-600 mt-2">
          0
        </h2>
      </div>

      <div class="panel p-5">
        <p class="text-gray-500 text-sm">Average Expense</p>
        <h2 id="average" class="text-2xl font-bold text-orange-500 mt-2">
          ₹0.00
        </h2>
      </div>

    </section>

    <!-- Add Expense Form -->
    <section class="panel p-5 sm:p-6 mb-7">
      <h2 class="text-lg font-bold mb-5">Add New Expense</h2>

      <form id="expenseForm"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">

        <input
          id="description"
          type="text"
          placeholder="Description"
          maxlength="100"
          required
          class="border rounded-lg p-3 w-full focus:outline-none focus:ring-2 focus:ring-indigo-400"
        >

        <input
          id="amount"
          type="number"
          placeholder="Amount"
          min="0.01"
          step="0.01"
          required
          class="border rounded-lg p-3 w-full focus:outline-none focus:ring-2 focus:ring-indigo-400"
        >

        <select id="category" required
          class="border rounded-lg p-3 w-full bg-white">
          <option value="">Category</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Health</option>
          <option>Other</option>
        </select>

        <input
          id="date"
          type="date"
          required
          class="border rounded-lg p-3 w-full"
        >

        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg p-3 transition">
          Add Expense
        </button>

      </form>
      <p id="message" class="text-sm mt-3" role="status"></p>
    </section>

    <!-- Expense History -->
    <section class="panel p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center
        justify-between gap-3 mb-5">
        <h2 class="text-lg font-bold">Expense History</h2>

        <select id="filter"
          class="border rounded-lg p-2 bg-white text-sm">
          <option value="All Categories">All Categories</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Health</option>
          <option>Other</option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-50">
            <tr>
              <th class="p-3">Description</th>
              <th class="p-3">Category</th>
              <th class="p-3">Date</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>

          <tbody id="expenseList">
            <tr>
              <td colspan="5" class="text-center text-gray-400 p-8">
                No expenses added yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="text-center text-gray-500 text-sm py-6">
      Smart Expense Tracker | Built with HTML, Tailwind CSS & JavaScript
    </footer>

  </main>

  <script>
    const form = document.getElementById("expenseForm");
    const description = document.getElementById("description");
    const amount = document.getElementById("amount");
    const category = document.getElementById("category");
    const date = document.getElementById("date");
    const filter = document.getElementById("filter");
    const expenseList = document.getElementById("expenseList");
    const message = document.getElementById("message");

    // Format today's date using local time
    function todayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    date.value = todayString();
    date.max = todayString();

    // Load saved expenses from browser storage
    let expenses = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem("smartExpenses") || "[]"
      );

      if (Array.isArray(saved)) {
        expenses = saved.filter(item =>
          item &&
          typeof item.id === "string" &&
          typeof item.description === "string" &&
          typeof item.category === "string" &&
          typeof item.date === "string" &&
          Number.isFinite(item.amount) &&
          item.amount > 0
        );
      }
    } catch (error) {
      expenses = [];
    }

    function saveExpenses() {
      try {
        localStorage.setItem(
          "smartExpenses",
          JSON.stringify(expenses)
        );
        return true;
      } catch (error) {
        message.textContent =
          "Unable to save data in this browser.";
        message.className = "text-sm mt-3 text-red-600";
        return false;
      }
    }

    function money(value) {
      return "₹" + value.toLocaleString("en-IN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function render() {
      const total = expenses.reduce(
        (sum, item) => sum + item.amount, 0
      );

      document.getElementById("total").textContent = money(total);
      document.getElementById("count").textContent = expenses.length;
      document.getElementById("average").textContent =
        money(expenses.length ? total / expenses.length : 0);

      expenseList.replaceChildren();

      const selectedCategory = filter.value;
      const visibleExpenses = expenses
        .filter(item =>
          selectedCategory === "All Categories" ||
          item.category === selectedCategory
        )
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date));

      if (visibleExpenses.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 5;
        cell.className = "text-center text-gray-400 p-8";
        cell.textContent = expenses.length
          ? "No expenses in this category."
          : "No expenses added yet.";

        row.appendChild(cell);
        expenseList.appendChild(row);
        return;
      }

      visibleExpenses.forEach(item => {
        const row = document.createElement("tr");
        row.className = "border-t hover:bg-gray-50";

        const values = [
          item.description,
          item.category,
          item.date,
          money(item.amount)
        ];

        values.forEach((value, index) => {
          const cell = document.createElement("td");
          cell.className = "p-3 whitespace-nowrap";
          cell.textContent = value;

          if (index === 3) {
            cell.classList.add("font-semibold", "text-indigo-700");
          }

          row.appendChild(cell);
        });

        const actionCell = document.createElement("td");
        actionCell.className = "p-3";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.className =
          "text-red-600 hover:text-red-800 font-medium";
        deleteButton.setAttribute(
          "aria-label", "Delete " + item.description
        );

        deleteButton.addEventListener("click", () => {
          const previous = expenses;
          expenses = expenses.filter(exp => exp.id !== item.id);

          if (!saveExpenses()) {
            expenses = previous;
          }

          render();
        });

        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);
        expenseList.appendChild(row);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const expenseName = description.value.trim();
      const expenseAmount = Number(amount.value);
      const expenseCategory = category.value;
      const expenseDate = date.value;

      if (
        !expenseName ||
        !Number.isFinite(expenseAmount) ||
        expenseAmount <= 0 ||
        !expenseCategory ||
        !expenseDate ||
        expenseDate > todayString()
      ) {
        message.textContent =
          "Please enter valid expense details.";
        message.className = "text-sm mt-3 text-red-600";
        return;
      }

      const expense = {
        id: Date.now().toString() + Math.random().toString(36).slice(2),
        description: expenseName,
        amount: expenseAmount,
        category: expenseCategory,
        date: expenseDate
      };

      expenses.push(expense);

      if (!saveExpenses()) {
        expenses.pop();
        return;
      }

      filter.value = "All Categories";
      render();

      message.textContent = "Expense added successfully!";
      message.className = "text-sm mt-3 text-green-600";

      form.reset();
      date.value = todayString();
    });

    filter.addEventListener("change", render);

    render();
  </script>

</body>
</html>
